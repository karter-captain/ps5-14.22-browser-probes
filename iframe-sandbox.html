<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iframe / sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
    pre { background: #161b22; padding: 16px; border-radius: 8px; overflow: auto; font-size: 0.85rem; }
    iframe { width: 100%; height: 120px; border: 1px solid #30363d; background: #000; margin: 8px 0; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Back</a></p>
  <h1>iframe / sandbox behavior</h1>
  <pre id="out">Loading frames...</pre>

  <h3>Same-origin iframe</h3>
  <iframe id="same" src="about:blank"></iframe>

  <h3>Sandboxed iframe (allow-scripts)</h3>
  <iframe id="sand" sandbox="allow-scripts" src="about:blank"></iframe>

  <script>
    const out = document.getElementById('out');
    function log(s) { out.textContent += s + '\n'; }

    function testFrame(id, label) {
      try {
        const f = document.getElementById(id);
        const doc = f.contentDocument;
        if (!doc) {
          log(label + ': contentDocument is null (blocked)');
          return;
        }
        doc.body.innerHTML = '<p style="color:#fff;font-family:sans-serif">' + label + ' reachable</p>';
        log(label + ': contentDocument accessible');
        try {
          f.contentWindow.postMessage({probe: true}, '*');
          log(label + ': postMessage sent');
        } catch (e) {
          log(label + ': postMessage failed - ' + e.message);
        }
      } catch (e) {
        log(label + ': ERROR - ' + e.message);
      }
    }

    window.addEventListener('message', e => {
      log('message event received: ' + JSON.stringify(e.data));
    });

    setTimeout(() => {
      log('=== iframe probes ===');
      testFrame('same', 'same-origin');
      testFrame('sand', 'sandboxed');
      log('Done.');
    }, 300);
  </script>
</body>
</html>
