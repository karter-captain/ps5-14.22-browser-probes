<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iframe sandbox // Y2JB style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #0f0; font-family: "Courier New", Courier, monospace; font-size: 13px; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; max-width: 900px; margin: 0 auto; }
    a { color: #0af; text-decoration: none; }
    iframe { width: 100%; height: 80px; border: 1px solid #030; background: #000; margin: 6px 0; }
    #out { flex: 1; overflow-y: auto; white-space: pre-wrap; background: #020202; border: 1px solid #030; padding: 10px; margin-top: 8px; }
    .ok { color: #0f0; } .fail { color: #f33; } .info { color: #0af; } .dim { color: #060; }
  </style>
</head>
<body>
  <div class="wrap">
    <div><a href="index.html">&lt;&lt; BACK</a> &nbsp; iframe / sandbox</div>
    <div style="color:#0a0; font-size:12px; margin:6px 0;">same-origin frame</div>
    <iframe id="same" src="about:blank"></iframe>
    <div style="color:#0a0; font-size:12px;">sandboxed (allow-scripts)</div>
    <iframe id="sand" sandbox="allow-scripts" src="about:blank"></iframe>
    <div id="out">Loading...\n</div>
  </div>
  <script>
    const out = document.getElementById('out');
    function log(s, cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = s;
      out.appendChild(d);
    }
    function testFrame(id, label) {
      try {
        const f = document.getElementById(id);
        const doc = f.contentDocument;
        if (!doc) {
          log('[-] ' + label + ': contentDocument null (blocked)', 'fail');
          return;
        }
        doc.body.innerHTML = '<p style="color:#0f0;font-family:monospace;font-size:12px;margin:4px">' + label + ' reachable</p>';
        log('[+] ' + label + ': contentDocument accessible', 'ok');
        try {
          f.contentWindow.postMessage({probe:true}, '*');
          log('[+] ' + label + ': postMessage sent', 'ok');
        } catch (e) {
          log('[-] ' + label + ': postMessage failed - ' + e.message, 'fail');
        }
      } catch (e) {
        log('[-] ' + label + ': ' + e.message, 'fail');
      }
    }
    window.addEventListener('message', e => {
      log('[+] message event: ' + JSON.stringify(e.data), 'ok');
    });
    setTimeout(() => {
      out.innerHTML = '';
      log('=== iframe probes ===', 'info');
      testFrame('same', 'same-origin');
      testFrame('sand', 'sandboxed');
      log('Done.', 'dim');
    }, 300);
  </script>
</body>
</html>
