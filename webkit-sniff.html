<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebKit Sniff // Y2JB style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #0f0; font-family: "Courier New", Courier, monospace; font-size: 13px; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; max-width: 900px; margin: 0 auto; }
    a { color: #0af; text-decoration: none; }
    a:hover { color: #fff; }
    #out { flex: 1; overflow-y: auto; white-space: pre-wrap; background: #020202; border: 1px solid #030; padding: 10px; margin-top: 8px; }
    .ok { color: #0f0; } .fail { color: #f33; } .info { color: #0af; } .dim { color: #060; }
  </style>
</head>
<body>
  <div class="wrap">
    <div><a href="index.html">&lt;&lt; BACK</a> &nbsp; WebKit / UA / Feature Sniff</div>
    <div id="out">Running...\n</div>
  </div>
  <script>
    const out = document.getElementById('out');
    function line(s, cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = s;
      out.appendChild(d);
    }
    try {
      line('=== Navigator ===', 'info');
      line('userAgent : ' + navigator.userAgent, 'ok');
      line('platform  : ' + navigator.platform, 'ok');
      line('vendor    : ' + navigator.vendor, 'ok');
      line('language  : ' + navigator.language, 'ok');
      line('cores     : ' + navigator.hardwareConcurrency, 'ok');
      line('deviceMem : ' + (navigator.deviceMemory || 'n/a'), 'ok');

      line('\n=== Screen / Window ===', 'info');
      line('screen : ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio||1), 'ok');
      line('inner  : ' + window.innerWidth + 'x' + window.innerHeight, 'ok');

      line('\n=== Feature Detection ===', 'info');
      const feats = {
        SharedArrayBuffer: typeof SharedArrayBuffer !== 'undefined',
        Atomics: typeof Atomics !== 'undefined',
        WebAssembly: typeof WebAssembly !== 'undefined',
        BigInt64Array: typeof BigInt64Array !== 'undefined',
        WebGL2: !!document.createElement('canvas').getContext('webgl2'),
        OffscreenCanvas: typeof OffscreenCanvas !== 'undefined',
        createImageBitmap: typeof createImageBitmap !== 'undefined',
        'performance.memory': !!(performance && performance.memory),
        crossOriginIsolated: window.crossOriginIsolated === true,
        isSecureContext: window.isSecureContext === true
      };
      Object.keys(feats).forEach(k => {
        line((feats[k] ? '[+] ' : '[-] ') + k, feats[k] ? 'ok' : 'fail');
      });

      if (performance && performance.memory) {
        line('\n=== performance.memory ===', 'info');
        line('jsHeapSizeLimit : ' + performance.memory.jsHeapSizeLimit, 'ok');
        line('totalJSHeapSize : ' + performance.memory.totalJSHeapSize, 'ok');
        line('usedJSHeapSize  : ' + performance.memory.usedJSHeapSize, 'ok');
      }

      const m = navigator.userAgent.match(/AppleWebKit\/([\d.]+)/);
      line('\n=== WebKit token ===', 'info');
      line(m ? m[0] : 'not found', m ? 'ok' : 'fail');

      line('\nDone.', 'dim');
    } catch (e) {
      line('ERROR: ' + e, 'fail');
    }
  </script>
</body>
</html>
